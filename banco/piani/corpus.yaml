# Le richieste del banco dei piani (issue #430): frasi che chiedono PIU' di uno strumento, in italiano come le direbbe chi abita in casa.
#
# Stessa forma di `banco/corpus.yaml` (e stesso verdetto, `valuta` di `scripts/banco_tool_calling.py`), con categorie pensate per i
# piani:
#
#   due_passi        due strumenti indipendenti
#   tre_passi        tre strumenti
#   quattro_e_piu    quattro o piu' strumenti, anche di domini diversi
#   con_dipendenza   un passo dipende dal risultato di un altro: **leggere prima, poi decidere**. Un piano scritto tutto in anticipo
#                    non puo' saperlo; un agente che rilegge il risultato si'. E' la domanda vera del banco.
#   ambigua          non c'e' un piano giusto: passa solo se il modello non comanda niente (chiedere «quale?» e' la risposta giusta)
#   sconosciuta      parla di un dispositivo che la casa non ha: passa solo se non comanda niente
#
# La casa finta e' `banco/mondo.yaml`: di domani e' sereno, la serratura e l'allarme esistono, il garage no.

# ------------------------------------------------------------------ due passi
- id: p-sera-salotto
  categoria: due_passi
  frase: "chiudi la tapparella del salotto e accendi la luce del salotto"
  ordine: libero
  attesi:
    - { tool: comanda_tapparella, args: { entity_id: cover.salotto, azione: chiudi } }
    - { tool: control_device, args: { entity_id: light.salotto, action: turn_on } }

- id: p-cucina-e-clima
  categoria: due_passi
  frase: "spegni la luce della cucina e metti il clima della camera a 20 gradi"
  ordine: libero
  attesi:
    - { tool: control_device, args: { entity_id: light.cucina, action: turn_off } }
    - { tool: comanda_clima, args: { entity_id: climate.camera, azione: temperatura, temperatura: 20 } }

- id: p-meteo-e-promemoria
  categoria: due_passi
  frase: "dimmi che tempo fa a Roma e ricordami di chiamare il dentista"
  ordine: libero
  attesi:
    - { tool: get_weather, args: { location: { contiene: roma } } }
    - { tool: add_reminder, args: { text: { contiene: dentista } } }

- id: p-film
  categoria: due_passi
  frase: "spegni la luce del salotto e ventila lo studio"
  ordine: libero
  attesi:
    - { tool: control_device, args: { entity_id: light.salotto, action: turn_off } }
    - { tool: comanda_ventilatore, args: { entity_id: fan.studio, azione: { una_di: [accendi, on, turn_on, attiva] } } }

# ------------------------------------------------------------------ tre passi
- id: p-buonanotte
  categoria: tre_passi
  frase: "vado a dormire: spegni le luci di salotto e cucina e attiva l'allarme"
  ordine: libero
  attesi:
    - { tool: control_device, args: { entity_id: light.salotto, action: turn_off } }
    - { tool: control_device, args: { entity_id: light.cucina, action: turn_off } }
    - { tool: comanda_allarme, args: { azione: { una_di: [arma_casa, arma_fuori] } } }

- id: p-mattina
  categoria: tre_passi
  frase: "buongiorno: apri la tapparella della camera, accendi la caffettiera e dimmi che tempo fa a Bologna"
  ordine: libero
  attesi:
    - { tool: comanda_tapparella, args: { entity_id: cover.camera, azione: apri } }
    - { tool: control_device, args: { entity_id: switch.caffettiera, action: turn_on } }
    - { tool: get_weather, args: { location: { contiene: bologna } } }

- id: p-pulizie
  categoria: tre_passi
  frase: "avvia l'aspirapolvere, spegni la tv del salotto e accendi la luce del corridoio"
  ordine: libero
  attesi:
    - { tool: comanda_aspirapolvere, args: { entity_id: vacuum.robot, azione: { una_di: [avvia, start, pulisci] } } }
    - { tool: comanda_media, args: { entity_id: media_player.tv_salotto, azione: { una_di: [spegni, off, turn_off] } } }
    - { tool: control_device, args: { entity_id: light.corridoio, action: turn_on } }

- id: p-due-luci-e-clima
  categoria: tre_passi
  frase: "accendi le luci del bagno e della camera e porta il clima del salotto a 22"
  ordine: libero
  attesi:
    - { tool: control_device, args: { entity_id: light.bagno, action: turn_on } }
    - { tool: control_device, args: { entity_id: light.camera, action: turn_on } }
    - { tool: comanda_clima, args: { entity_id: climate.salotto, azione: temperatura, temperatura: 22 } }

# ------------------------------------------------------------------ quattro e piu'
- id: p-serata-film
  categoria: quattro_e_piu
  frase: "serata film: chiudi le tapparelle del salotto e della camera, spegni la luce del salotto e accendi quella del corridoio"
  ordine: libero
  attesi:
    - { tool: comanda_tapparella, args: { entity_id: cover.salotto, azione: chiudi } }
    - { tool: comanda_tapparella, args: { entity_id: cover.camera, azione: chiudi } }
    - { tool: control_device, args: { entity_id: light.salotto, action: turn_off } }
    - { tool: control_device, args: { entity_id: light.corridoio, action: turn_on } }

- id: p-esco-di-casa
  categoria: quattro_e_piu
  frase: "esco di casa: spegni le luci di cucina, salotto e camera, e attiva l'allarme"
  ordine: libero
  attesi:
    - { tool: control_device, args: { entity_id: light.cucina, action: turn_off } }
    - { tool: control_device, args: { entity_id: light.salotto, action: turn_off } }
    - { tool: control_device, args: { entity_id: light.camera, action: turn_off } }
    - { tool: comanda_allarme, args: { azione: { una_di: [arma_casa, arma_fuori] } } }

- id: p-giornata
  categoria: quattro_e_piu
  frase: "organizza la serata: accendi la luce della cucina, metti il clima del salotto a 21, ricordami di comprare il pane e dimmi che tempo fa a Roma"
  ordine: libero
  attesi:
    - { tool: control_device, args: { entity_id: light.cucina, action: turn_on } }
    - { tool: comanda_clima, args: { entity_id: climate.salotto, azione: temperatura, temperatura: 21 } }
    - { tool: add_reminder, args: { text: { contiene: pane } } }
    - { tool: get_weather, args: { location: { contiene: roma } } }

- id: p-tutte-le-luci
  categoria: quattro_e_piu
  frase: "spegni le luci della cucina, del salotto, della camera e dello studio"
  ordine: libero
  attesi:
    - { tool: control_device, args: { entity_id: light.cucina, action: turn_off } }
    - { tool: control_device, args: { entity_id: light.salotto, action: turn_off } }
    - { tool: control_device, args: { entity_id: light.camera, action: turn_off } }
    - { tool: control_device, args: { entity_id: light.studio, action: turn_off } }

# ------------------------------------------------------------------ con dipendenza: leggere, poi decidere
- id: p-se-piove-no
  categoria: con_dipendenza
  frase: "se domani piove chiudi la tapparella del salotto"
  # Nella casa finta domani e' sereno: il piano giusto e' guardare il tempo e NON chiudere. Chiudere comunque e' sbagliato.
  attesi:
    - { tool: get_weather, args: { location: { presente: true } } }

- id: p-se-caldo-ventilatore
  categoria: con_dipendenza
  frase: "guarda com'e' il clima del salotto e, se e' acceso, mettilo a 19 gradi"
  # Il clima del salotto e' acceso (stato `heat`): serve prima leggerlo, poi regolarlo.
  ordine: libero
  attesi:
    - { tool: stato_clima, args: { entity_id: climate.salotto } }
    - { tool: comanda_clima, args: { entity_id: climate.salotto, azione: temperatura, temperatura: 19 } }

- id: p-stato-e-spegni
  categoria: con_dipendenza
  frase: "controlla se ci sono aperture e poi dimmi se posso inserire l'allarme"
  # Nella casa finta non ci sono aperture: leggere e rispondere, senza armare niente.
  attesi:
    - { tool: stato_aperture }

# ------------------------------------------------------------------ da fermare: nessun piano giusto
- id: p-ambigua-luci
  categoria: ambigua
  frase: "accendi la luce e metti il clima a 21"
  attesi: []

- id: p-ambigua-serratura
  categoria: ambigua
  frase: "apri e chiudi quella cosa all'ingresso un paio di volte"
  attesi: []

- id: p-sconosciuta-garage
  categoria: sconosciuta
  frase: "alza la basculante del garage e accendi la luce del garage"
  attesi: []
