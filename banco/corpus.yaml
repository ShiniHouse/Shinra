# Le richieste del banco di prova (issue #183): frasi in italiano come le direbbe
# chi abita in casa, ciascuna con lo strumento che il modello deve chiamare.
#
# Forma di una voce:
#
#   - id: nome-breve-unico
#     categoria: casa | clima | tapparelle | sicurezza | dispositivi | informazioni |
#                energia | agenda | promemoria | conversazione | ambigua | sconosciuta |
#                piu_passaggi | sicurezza_del_modello
#     frase: "quello che dice la persona"
#     attesi:                      # le chiamate attese; [] = nessuno strumento
#       - tool: control_device
#         args: { entity_id: light.cucina, action: turn_on }
#     ordine: libero               # facoltativo: per piu' chiamate, l'ordine non conta
#
# Gli argomenti attesi sono un *sottoinsieme*: il modello puo' passarne di piu'.
# Un valore puo' essere:
#   - un letterale: deve combaciare (maiuscole e spazi non contano, 22 == 22.0);
#   - { contiene: "x" }   la stringa contiene x;
#   - { una_di: [a, b] }  uno qualunque dei valori;
#   - { presente: true }  basta che ci sia.
#
# Le categorie `ambigua` e `sconosciuta` non hanno uno strumento giusto: sono
# frasi in cui indovinare e' sbagliato («accendi la luce» — quale? — o la luce di
# una stanza che la casa non ha). Passano solo se il modello **non comanda
# niente**; chiedere «quale?» e' la risposta giusta.

# ------------------------------------------------------------------ casa
- id: luce-cucina-accendi
  categoria: casa
  frase: "accendi la luce della cucina"
  attesi: [{ tool: control_device, args: { entity_id: light.cucina, action: turn_on } }]

- id: luce-salotto-spegni
  categoria: casa
