# Come si dicono le cose, in italiano.
#
# Questo file non contiene traduzioni di etichette: contiene gli schemi con cui
# Shinra **capisce** una frase prima di chiamare il modello. Finche' stavano
# scritti dentro `casa.py`, `informazioni.py` e `promemoria.py`, aggiungere una
# lingua voleva dire modificare la logica — che e' il difetto da cui nasce la
# issue #36, e il suo criterio di accettazione: «aggiungere una lingua non
# richiede modifiche al codice della logica».
#
# Un file nuovo accanto a questo, con le stesse chiavi, e' una lingua nuova.
# Il caricatore dice per nome quale chiave manca, invece di lasciar fallire un
# intento a meta'.
#
# Riferimento: issue #36.

lingua: it
nome: italiano

casa:
  # Parole che dicono «qui dentro», non «fuori». Servono a distinguere «che
  # temperatura c'e' in salotto» — un sensore di casa — da «che temperatura
  # c'e' a Bologna», che e' il meteo.
  segnali_interni:
    - in casa
    - dentro
    - qui
    - in salotto
    - in cucina
    - in camera
    - in bagno
    - in sala
    - in soggiorno
    - in taverna
    - in garage
    - in mansarda
    - in studio
    - in corridoio
    - in ingresso
    - in cantina

  # «Accendi la luce della cucina»: il verbo, poi l'articolo facoltativo, poi
  # il nome della cosa. Il primo gruppo e' il verbo, il secondo la cosa.
  controllo_dispositivo: "^(accendi|attiva|spegni|disattiva)\\s+(?:la\\s+|il\\s+|le\\s+|l'|i\\s+|gli\\s+)?(.+)$"

  # Quali di quei verbi accendono. Gli altri spengono.
  verbi_che_accendono:
    - accendi
    - attiva

  # Le parole che fanno pensare a un sensore di casa: «che temperatura c'e'».
  parole_temperatura:
    - temperatura
    - che caldo
    - che freddo
    - gradi

  # «in salotto», «nella taverna»: la preposizione e poi il nome della stanza.
  preposizioni_stanza: "\\b(?:in|nel|nella|del|della|al|alla)\\s+([a-zàèéìòù]+)"

meteo:
  parole:
    - meteo
    - tempo a
    - tempo fa
    - tempo farà
    - previsioni
    - pioverà
    - piove
    - temperatura
    - gradi fuori

  # La parola con cui si chiede il giorno dopo invece di adesso.
  domani: domani

  # «a Reggio Emilia», «ad Alfonsine», «a San Giovanni in Persiceto». Il nome
  # puo' essere composto e contenere preposizioni interne: si prendono le
  # parole che cominciano per maiuscola piu' i collegamenti fra loro. Una
  # vecchia versione ne catturava una sola, e spezzava a meta' meta' Italia.
  citta: "\\b(?:a|ad|in|per|di)\\s+((?:[A-ZÀ-Ù][\\wàèéìòùç']*)(?:\\s+(?:d[ei]|del|della|delle|dei|in|al|sul|sulla|a)\\s+[A-ZÀ-Ù]?[\\wàèéìòùç']*|\\s+[A-ZÀ-Ù][\\wàèéìòùç']*)*)"

enciclopedia:
  inneschi:
    - cosa significa
    - chi era
    - chi è
    - chi fu
    - definizione di
    - cos'è
    - che cos'è
    - spiegami
    - quando è
    - quando e
    - patrono
    - storia di
    - dove si trova
    - chi sono
    - biografia di

  # Si toglie la domanda e resta il termine da cercare.
  pulizia: "^(cosa significa|chi era|chi è|chi fu|definizione di|cos'è|che cos'è|spiegami|il termine|la parola|quando è|quando e|dove si trova|storia di|patrono di|la festa di|il santo)\\s+"

apprendimento:
  avvii:
    - kyra istruisci
    - kira istruisci
    - chira istruisci
    - shinra istruisci
    - istruisci
    - modalità apprendimento
    - impara la casa
    - intervista casa
    - insegna abitudini
    - voglio insegnarti
    - impara abitudini

  interruzioni:
    - annulla intervista
    - ferma intervista
    - esci da apprendimento
    - stop intervista
    - annulla

notizie:
  inneschi:
    - notizie
    - ultime notizie
    - rassegna stampa
    - cosa succede

# Le parole che fanno passare al modello gli strumenti. Senza una di queste
# la frase va al modello senza tool: serve a non dargli il catalogo intero
# per una chiacchierata.
agente:
  parole_azione:
    - accend
    - spegn
    - attiva
    - disattiva
    - imposta
    - regola
    - alza
    - abbassa
    - chiudi
    - apri
    - luce
    - luci
    - lampad
    - termostato
    - presa
    - interruttore
    - modalità
    - routine
    - stato casa
    - cerca sul web
    - cerca su internet
    - trova online
    - dispositivi
    - entità
    # --- aggiunte dalla #183: il banco di prova ha mostrato che meta' delle
    # richieste che hanno uno strumento arrivavano al modello senza strumenti,
    # e il modello non poteva che inventare la risposta.
    - metti
    - porta
    - avvia
    - ferma
    - pausa
    - riprendi
    - volume
    - meteo
    - che tempo
    - notizie
    - chi era
    - cosa significa
    - lista
    - spesa
    - ricordami
    - promemoria
    - scadenz
    - scade
    - appuntament
    - impegn
    - programma
    - agenda
    - consum
    - energia
    - fascia
    - quanto costa
    - quanto mi costa
    - clima
    - condizionatore
    - tapparell
    - finestr
    - serratura
    - allarme
    - aspirapolvere
    - televisione
    - tv
    - ventilatore
    - com'è la casa
    - stato della casa

# Le risposte a una domanda di conferma (issue #192). Solo frasi **intere**: «si'» e
# «no» da soli, o poco piu'. «si' ma prima chiudi la finestra» e' un'altra richiesta,
# non una conferma — e un «si'» che apre una porta deve essere inequivocabile.
conferma:
  accetta: ["sì", "si", "sì grazie", "si grazie", "confermo", "conferma", "ok", "va bene", "certo", "procedi", "fallo", "sì confermo", "si confermo"]
  rifiuta: ["no", "no grazie", "annulla", "lascia stare", "non farlo", "fermati", "rifiuto", "negativo", "stop"]

# I nomi dei giorni e dei mesi stanno qui e non nel locale del sistema:
# altrimenti la data nel prompt dipenderebbe da come e' configurata la
# macchina, e una macchina in inglese farebbe parlare l'assistente in
# italiano con la data in inglese.
calendario:
  giorni: [lunedì, martedì, mercoledì, giovedì, venerdì, sabato, domenica]
  mesi: [gennaio, febbraio, marzo, aprile, maggio, giugno, luglio, agosto, settembre, ottobre, novembre, dicembre]
  formato_data: "{giorno} {numero} {mese} {anno}, ore {ore}:{minuti}"

# Le frasi che Shinra dice senza passare dal modello: le risposte degli
# intenti, il rifiuto, i messaggi di errore. Ogni chiave e' nell'elenco
# `CHIAVI_MESSAGGI` del caricatore, che dice per nome quale manca.
messaggi:
  temperatura_sensori_illeggibili: "Non riesco a leggere i sensori di casa."
  temperatura_nessun_sensore: "Non trovo un sensore di temperatura in casa."
  temperatura_nessun_sensore_in: "Non trovo un sensore di temperatura in {stanza}."
  temperatura_una_lettura: "{nome}: {valore} gradi."
  temperatura_piu_letture: "Temperature in casa: {elenco} gradi."
  dispositivo_negato: "Non hai il permesso di comandare questo dispositivo."
  dispositivo_non_comandato: "Non sono riuscito a comandare {nome}."
  dispositivo_acceso: "{nome} acceso."
  dispositivo_spento: "{nome} spento."
  modalita_attivata: "Modalità {nome} attivata."
  meteo_domani: "Domani a {localita} {condizione}, max {massima} gradi e min {minima}."
  meteo_adesso: "A {localita} attualmente {temperatura}, {condizione}."
  meteo_massima: " Massima prevista di {massima} gradi."
  condizione_variabile: "variabile"
  notizie_ultime: "Ultime notizie: {titoli}"
  apprendimento_interrotto: "Modalità Apprendimento interrotta. Possiamo riprendere quando vuoi."
  timer_impostato: "Timer di {quantita} {unita} impostato per {etichetta}."
  promemoria_impostato: "Perfetto, ti ricorderò di {testo} {quando}."
  argomento_vietato: "Di questo preferisco non parlare. Se ti serve, chiedilo a un adulto di casa."
  errore_ollama: "Si è verificato un problema di comunicazione con il motore IA: {errore}. Assicurati che Ollama sia avviato e il modello sia pronto."
  operazione_completata: "Operazione completata."
  dati_verificati: "Ho elaborato la tua richiesta e verificato i dati."
  risultato_operazione: "Risultato operazione {tool}: {risultato}. Formula ora una risposta breve e naturale per l'utente."
  conferma_richiesta: "Sto per eseguire: {azione}. Confermi? Rispondi «sì» o «no» entro {minuti} minuti."
  conferma_vietata: "Questa azione non può partire da un assistente: va fatta da una persona, dalla dashboard."
  conferma_senza_identita: "Non lo faccio: non so chi sta parlando. Associa la tua voce a un profilo dalle impostazioni, oppure fallo dalla dashboard."
  conferma_senza_canale: "Non lo faccio: non c'è nessuno a cui chiedere conferma. Va richiesta da una persona, dalla dashboard o a voce."
  conferma_nessuna: "Non c'è niente da confermare."
  conferma_scaduta: "La conferma è scaduta: non ho fatto niente. Se vuoi, richiedilo."
  conferma_rifiutata: "Va bene, non faccio niente."
  conferma_eseguita: "Fatto."

# Il prompt di sistema, a pezzi. La lingua in cui il modello risponde si
# decide qui: risponde in quella in cui gli si parla.
prompt:
  intro: "Sei {assistente}, assistente domestico intelligente. Oggi è {adesso}. Città di riferimento: {citta}."
  utente_anonimo: "Utente"
  persona_bambino: "Parli con il bambino {nome}. Usa linguaggio semplice, allegro e rassicurante. Niente contenuti violenti o complessi."
  persona_ragazzo: "Parli con il ragazzo {nome}. Sii pratico, diretto e chiaro."
  persona_adulto: "Parli con {nome} ({ruolo}). Stile Jarvis: cordiale, riservato, preciso, risposte brevi e naturali in italiano. Evita frasi verbose."
  ruolo_admin: "Amministratore"
  ruolo_adulto: "Adulto"
  titolo_conoscenza: "CONOSCENZA CASA"
  titolo_alias: "ALIAS DISPOSITIVI"
  titolo_modalita: "MODALITÀ"
  titolo_dispositivi: "DISPOSITIVI ATTIVI"
  informazioni_in_tempo_reale: "### INFORMAZIONI IN TEMPO REALE:"
  informazioni_chiusura: "Rispondi direttamente alla domanda dell'utente comunicando questi dati in modo sintetico e naturale (1-2 frasi). Non menzionare API o funzioni tecniche."
  regole: |-
    REGOLE SUI TOOL (Usa sempre i tool per dati in tempo reale o azioni):
    - METEO: Per qualsiasi domanda sul meteo o temperature, chiama SEMPRE il tool `get_weather` (default location: "{citta}").
    - DOMOTICA: Per accendere/spegnere/regolare luci o verificare lo stato di casa, chiama `control_device` o `get_home_status`.
    - CLIMA: Per modalita' (riscaldamento, raffrescamento, deumidificazione, ventilazione), temperatura, ventola, umidita' o profili, chiama `comanda_clima`; per sapere come e' impostato, `stato_clima`. La temperatura IMPOSTATA e quella MISURATA sono due cose diverse: non spacciare l'una per l'altra.
    - TAPPARELLE: Per aprire, chiudere, fermare a meta' corsa, portare a una percentuale o orientare le lamelle, chiama `comanda_tapparella`. La percentuale dice quanto e' APERTA: 0 chiusa, 100 aperta, quindi "abbassala al 40%" significa posizione 40.
    - ENERGIA: Per consumi e costi chiama `consumo_energia`; per «in che fascia siamo» `fascia_corrente`; per «quanto mi costa tenere acceso questo» `costo_dispositivo`. Se il tool dice che non ha letture, riferiscilo: non inventare un numero e non rispondere zero.
    - LISTE: Per la spesa e le cose da fare chiama `aggiungi_a_lista`, `leggi_lista`, `togli_da_lista`. Piu' articoli in una frase sono piu' voci: passali tutti insieme, ci pensa il tool a separarli.
    - CALENDARIO: Per «cosa ho oggi/domani/sabato» chiama `impegni`; per i prossimi giorni `prossimi_impegni`; per segnare qualcosa `aggiungi_impegno`.
    - SCADENZE: Per filtri, revisione, bollo e garanzie chiama `aggiungi_scadenza`, `scadenze_in_arrivo`, `segna_fatta`. Se un tool risponde che gli serve sapere QUANDO, chiedilo alla persona: non inventare una data e non dire che hai segnato.
    - NOTIZIE: Per notizie del giorno o rassegna stampa, chiama `get_latest_news` o `search_web`.
    - CULTURA & DEFINIZIONI: Per definizioni o concetti, chiama `search_wikipedia`.
    Non dire mai che non puoi accedere a dati in tempo reale: invoca sempre il tool appropriato. Quando ricevi i dati dal tool, formula una risposta breve, chiara e naturale per l'utente in 1-2 frasi.
