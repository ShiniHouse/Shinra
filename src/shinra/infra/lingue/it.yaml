# Come si dicono le cose, in italiano.
#
# Questo file non contiene traduzioni di etichette: contiene gli schemi con cui
# Shinra **capisce** una frase prima di chiamare il modello. Finche' stavano
# scritti dentro `casa.py`, `informazioni.py` e `promemoria.py`, aggiungere una
# lingua voleva dire modificare la logica — che e' il difetto da cui nasce la
# issue #36, e il suo criterio di accettazione: «aggiungere una lingua non
# richiede modifiche al codice della logica».
#
# Un file nuovo accanto a questo, con le stesse chiavi, e' una lingua nuova.
# Il caricatore dice per nome quale chiave manca, invece di lasciar fallire un
# intento a meta'.
#
# Riferimento: issue #36.

lingua: it
nome: italiano

casa:
  # Parole che dicono «qui dentro», non «fuori». Servono a distinguere «che
  # temperatura c'e' in salotto» — un sensore di casa — da «che temperatura
  # c'e' a Bologna», che e' il meteo.
  segnali_interni:
    - in casa
    - dentro
    - qui
    - in salotto
    - in cucina
    - in camera
    - in bagno
    - in sala
    - in soggiorno
    - in taverna
    - in garage
    - in mansarda
    - in studio
    - in corridoio
    - in ingresso
    - in cantina

  # «Accendi la luce della cucina»: il verbo, poi l'articolo facoltativo, poi
  # il nome della cosa. Il primo gruppo e' il verbo, il secondo la cosa.
  controllo_dispositivo: "^(accendi|attiva|spegni|disattiva)\\s+(?:la\\s+|il\\s+|le\\s+|l'|i\\s+|gli\\s+)?(.+)$"

  # Quali di quei verbi accendono. Gli altri spengono.
  verbi_che_accendono:
    - accendi
    - attiva

  # Le parole che fanno pensare a un sensore di casa: «che temperatura c'e'».
  parole_temperatura:
    - temperatura
    - che caldo
    - che freddo
    - gradi

  # «in salotto», «nella taverna»: la preposizione e poi il nome della stanza.
  preposizioni_stanza: "\\b(?:in|nel|nella|del|della|al|alla)\\s+([a-zàèéìòù]+)"

meteo:
  parole:
    - meteo
    - tempo a
    - tempo fa
    - tempo farà
    - previsioni
    - pioverà
    - piove
    - temperatura
    - gradi fuori

  # La parola con cui si chiede il giorno dopo invece di adesso.
  domani: domani

  # «a Reggio Emilia», «ad Alfonsine», «a San Giovanni in Persiceto». Il nome
  # puo' essere composto e contenere preposizioni interne: si prendono le
  # parole che cominciano per maiuscola piu' i collegamenti fra loro. Una
  # vecchia versione ne catturava una sola, e spezzava a meta' meta' Italia.
  citta: "\\b(?:a|ad|in|per|di)\\s+((?:[A-ZÀ-Ù][\\wàèéìòùç']*)(?:\\s+(?:d[ei]|del|della|delle|dei|in|al|sul|sulla|a)\\s+[A-ZÀ-Ù]?[\\wàèéìòùç']*|\\s+[A-ZÀ-Ù][\\wàèéìòùç']*)*)"

enciclopedia:
  inneschi:
    - cosa significa
    - chi era
    - chi è
    - chi fu
    - definizione di
    - cos'è
    - che cos'è
    - spiegami
    - quando è
    - quando e
    - patrono
    - storia di
    - dove si trova
    - chi sono
    - biografia di

  # Si toglie la domanda e resta il termine da cercare.
  pulizia: "^(cosa significa|chi era|chi è|chi fu|definizione di|cos'è|che cos'è|spiegami|il termine|la parola|quando è|quando e|dove si trova|storia di|patrono di|la festa di|il santo)\\s+"

apprendimento:
  avvii:
    - kyra istruisci
    - kira istruisci
    - chira istruisci
    - shinra istruisci
    - istruisci
    - modalità apprendimento
    - impara la casa
    - intervista casa
    - insegna abitudini
    - voglio insegnarti
    - impara abitudini

  interruzioni:
    - annulla intervista
    - ferma intervista
    - esci da apprendimento
    - stop intervista
    - annulla

notizie:
  inneschi:
    - notizie
    - ultime notizie
    - rassegna stampa
    - cosa succede

# Le parole che fanno passare al modello gli strumenti. Senza una di queste
# la frase va al modello senza tool: serve a non dargli il catalogo intero
# per una chiacchierata.
agente:
  # Quale agente di dominio prende la richiesta (ADR 0008, issue #190): le
  # parole che la riportano a un dominio, in minuscolo e senza la desinenza,
  # cosi' «tapparell» prende tapparella e tapparelle. Le parole generiche
  # (metti, porta) non stanno qui: non dicono di cosa si parla.
  domini:
    casa: [accend, spegn, luce, luci, lampad, presa, interruttore, caffettier, modalità, routine, scena, stato casa, "com'è la casa", stato della casa, dispositivi, entità]
    clima_e_tapparelle: [clima, condizionatore, termostato, riscald, temperatura, gradi, tapparell, persian, "serrand"]
    dispositivi: [serratura, chiave, "porta di ingresso", "porta d'ingresso", aspirapolvere, robot, televisione, "tv", ventilatore, volume, pausa, riprendi, musica]
    sicurezza: [allarme, finestr, apert, antifurto, simulazione presenza, "sicurezza"]
    energia: [consum, energia, fascia, kwh, bolletta, quanto costa, quanto mi costa, tariffa]
    informazioni: [meteo, che tempo, previsioni, piove, notizie, chi era, cosa significa, wikipedia, cerca sul web, cerca su internet, trova online]
    promemoria: [ricordami, promemoria, ricorda, timer, sveglia]
    agenda: [lista, spesa, scadenz, scade, appuntament, impegn, programma, agenda, calendario, fatto, dimentica]
  parole_azione:
    - accend
    - spegn
    - attiva
    - disattiva
    - imposta
    - regola
    - alza
    - abbassa
    - chiudi
    - apri
    - luce
    - luci
    - lampad
    - termostato
    - presa
    - interruttore
    - modalità
    - routine
    - stato casa
    - cerca sul web
    - cerca su internet
    - trova online
    - dispositivi
    - entità
    # --- aggiunte dalla #183: il banco di prova ha mostrato che meta' delle
    # richieste che hanno uno strumento arrivavano al modello senza strumenti,
    # e il modello non poteva che inventare la risposta.
    - metti
    - porta
    - avvia
    - ferma
    - pausa
    - riprendi
    - volume
    - meteo
    - che tempo
    - notizie
    - chi era
    - cosa significa
    - lista
    - spesa
    - ricordami
    - promemoria
    - scadenz
    - scade
    - appuntament
    - impegn
    - programma
    - agenda
    - consum
    - energia
    - fascia
    - quanto costa
    - quanto mi costa
    - clima
    - condizionatore
    - tapparell
    - finestr
    - serratura
    - allarme
    - aspirapolvere
    - televisione
    - tv
    - ventilatore
    - com'è la casa
    - stato della casa

# Le risposte a una domanda di conferma (issue #192). Solo frasi **intere**: «si'» e
# «no» da soli, o poco piu'. «si' ma prima chiudi la finestra» e' un'altra richiesta,
# non una conferma — e un «si'» che apre una porta deve essere inequivocabile.
conferma:
  accetta: ["sì", "si", "sì grazie", "si grazie", "confermo", "conferma", "ok", "va bene", "certo", "procedi", "fallo", "sì confermo", "si confermo"]
  rifiuta: ["no", "no grazie", "annulla", "lascia stare", "non farlo", "fermati", "rifiuto", "negativo", "stop"]

# I nomi dei giorni e dei mesi stanno qui e non nel locale del sistema:
# altrimenti la data nel prompt dipenderebbe da come e' configurata la
# macchina, e una macchina in inglese farebbe parlare l'assistente in
# italiano con la data in inglese.
calendario:
  giorni: [lunedì, martedì, mercoledì, giovedì, venerdì, sabato, domenica]
  mesi: [gennaio, febbraio, marzo, aprile, maggio, giugno, luglio, agosto, settembre, ottobre, novembre, dicembre]
  formato_data: "{giorno} {numero} {mese} {anno}, ore {ore}:{minuti}"


# Il tempo detto a parole (#205): cosa leggono timer, promemoria, scadenze e impegni.
# Le espressioni regolari sono tra apici singoli, cosi' il backslash resta com'e'. Le parole
# si scrivono senza accenti (il testo si normalizza prima del confronto).
tempo:
  numeri:
    un: 1
    uno: 1
    una: 1
    due: 2
    tre: 3
    quattro: 4
    cinque: 5
    sei: 6
    sette: 7
    otto: 8
    nove: 9
    dieci: 10
    quindici: 15
    venti: 20
    trenta: 30
    quaranta: 40
    sessanta: 60
    undici: 11
    dodici: 12
    venticinque: 25
    quarantacinque: 45
    cinquanta: 50
    novanta: 90
  # Per ogni momento della giornata, le parole che lo dicono (l'ora la decide il codice).
  momenti:
    morning: [mattina, mattino, mattinata, stamattina, stamane]
    noon: [mezzogiorno, pranzo]
    afternoon: [pomeriggio]
    evening: [sera, serata, stasera, cena]
    night: [notte, stanotte]
  # Un pasto e' insieme un'ora e un titolo: «dopo cena» e' un'ora, «cena con Marco» un impegno.
  pasti: [pranzo, cena]
  prima_dei_pasti: '(?:a|per|dopo|verso|prima\s+di|entro)'
  settimana: [lunedi, martedi, mercoledi, giovedi, venerdi, sabato, domenica]
  mesi: [gennaio, febbraio, marzo, aprile, maggio, giugno, luglio, agosto, settembre, ottobre, novembre, dicembre]
  word_today: 'oggi'
  word_tomorrow: 'domani'
  word_day_after_tomorrow: 'dopodomani'
  next_weekday: '{giorno}\s+prossimo'
  fra: '(?:tra|fra|entro)'
  unita:
    minutes: 'minut\w*'
    hours: 'or[ae]'
    days: 'giorn\w*'
    weeks: 'settiman\w*'
    months: 'mes\w*'
  mezz_ora: '(?:tra|fra)\s+mezz\s*ora'
  alle: 'all[ae]'
  e_mezza: 'e\s+mezza'
  dopo_mezzogiorno: '(?:di sera|del pomeriggio|di pomeriggio)'
  # «il 15», «il 15 marzo», «il 15/3»
  date:
    - '\b(?:il|per il|entro il)\s+(?P<giorno>\d{1,2})(?:\s+(?P<mese>@MESI@)|[/-](?P<mese_num>\d{1,2}))?\b'
  # Altre espressioni da togliere dal testo di un promemoria.
  extra:
    - '\b(?:di mattina|del mattino)\b'
    - '\bquesta\s+(?:mattina|sera|notte)\b'
    - '\bnel\s+pomeriggio\b'
    - '\bin\s+(?:mattinata|serata)\b'
  servizio_finale: '(?:di|a|per|che|devo|dovrei)'
  servizio_iniziale: '(?:di|che|devo|dovrei)'
  # Come si ridice un momento a chi ha chiesto.
  frasi:
    today: 'oggi alle {ora}'
    tomorrow: 'domani alle {ora}'
    day_after_tomorrow: 'dopodomani alle {ora}'
    weekday: '{giorno} alle {ora}'
    date: 'il {data} alle {ora}'

# Timer e promemoria: le frasi che li chiedono.
timer:
  verbi: '(?:metti|imposta|avvia|crea)'
  articolo: '(?:un\s+)?'
  parola: 'timer'
  prima_della_durata: '(?:(?:di|d|per|da|entro)\s+)?'
  unita:
    secondi: 'secondi|secondo'
    minuti: 'minuti|minuto'
    ore: 'ore|ora'
  prima_dell_etichetta: '(?:per|da|chiamato)'
  mezz_ora: 'mezz.ora|mezzora'
  promemoria: '(?:ricordami|ricordati|ricordarmi|segnati|promemoria)\s*(?:che\s+)?(?:devo\s+)?(?:di\s+)?'
  etichetta_predefinita: 'Timer'
  unita_a_voce: {secondi: secondi, minuti: minuti, ore: ore}

# Le frasi che Shinra dice senza passare dal modello: le risposte degli
# intenti, il rifiuto, i messaggi di errore. Ogni chiave e' nell'elenco
# `CHIAVI_MESSAGGI` del caricatore, che dice per nome quale manca.

# L'intervista di apprendimento (#207): i passi, le frasi, le parole di «si'» e «no», e il prompt di estrazione.
# I passi stanno qui con il testo di ogni lingua; la struttura (id, categoria, cosa la casa sa gia') e' nel codice.
intervista:
  afferma: ["si", "sì", "s", "ok", "okay", "va bene", "vabene", "giusto", "esatto", "esattamente", "corretto", "perfetto", "certo", "confermo", "conferma", "yes", "y", "tutto giusto", "e giusto", "è giusto", "sì esatto", "si esatto"]
  nega: ["no", "n", "nope", "sbagliato", "niente", "annulla", "salta", "lascia perdere", "no grazie", "non e giusto", "non è giusto"]
  salta: ["salta", "no", "niente", "nulla", "nessuno", "lascia perdere", "non so", "boh", "basta"]
  testi:
    saluto: "Modalità Apprendimento attivata. Ti farò qualche breve domanda, una per volta, per imparare a gestire la tua casa al meglio. "
    salto: "{noto}: salto la domanda."
    niente_da_chiedere: "Non ho niente da chiedere: la casa mi ha già detto tutto quello che serve."
    riconoscimento_non_interpretato: "Ho conservato la tua risposta, ma non sono riuscita a ricavarne niente di preciso: il modello non ha risposto come mi serve. Controlla quale modello e' configurato — per capire una frase e riassumerla ne serve uno da qualche miliardo di parametri. Intanto proseguo. "
    riconoscimento_n: "Ricevuto! Ho aggiunto {quanti} nuovi dettagli alla mia conoscenza. "
    riconoscimento_niente: "Ho letto, ma da questa risposta non ho ricavato niente da ricordare: se ti va, piu' avanti riprendiamo con qualche dettaglio in piu'. "
    chiusura_errori: "Intervista finita. Ho memorizzato {imparati} fatti, ma {non_interpretate} delle tue risposte non sono riuscita a interpretarle: le ho conservate cosi' come le hai scritte. Con un modello piu' capace vale la pena rifarla — imparerei molto di piu' dalle stesse risposte."
    chiusura_ok: "Ottimo lavoro! Intervista completata. Ho memorizzato {imparati} fatti sulla tua casa e calibrato le mie risposte per te e la tua famiglia."
    chiusura_alias_uno: " Ho dato un nome a {n} dispositivo: da ora li capisco a voce."
    chiusura_alias_piu: " Ho dato un nome a {n} dispositivi: da ora li capisco a voce."
    riepilogo: "Ho capito questo:\n{elenco}\nÈ giusto? Rispondi «sì» e lo salvo. Se ho capito male, riscrivimelo come lo diresti tu; se preferisci lasciar perdere, rispondi «no»."
    suggerimento_conferma: "Rispondi «sì» per salvare, «no» per saltare, oppure riscrivi la frase come la diresti tu."
    insistenza_non_interpretato: "Non sono riuscita a ricavarne niente di preciso."
    insistenza_vuota: "Da questa risposta non ho ricavato niente da ricordare."
    insistenza: "{apertura} Ci riprovo una volta sola, poi passo oltre.\n{domanda}{esempio}"
    per_esempio: "\nPer esempio: «{esempio}»"
    non_salvo: "Va bene, non salvo niente di questo passo. "
    salvo_cosi: "Salvo così e proseguo, per non farti riscrivere all'infinito. "
    routine_proposta: "\n\n💡 Ho notato una possibile routine, «{nome}»:\n{anteprima}\nProva a secco: {prova}.{scartate} Vuoi che la crei? La potrai modificare nell'editor."
    routine_scartate: " Ho scartato: {elenco}."
    routine_prova_non_fatta: "non fatta"
    routine_non_supera: "La routine non supera il controllo sulla casa vera."
    alias_titolo: "Il nome di un dispositivo"
    alias_domanda: "Come chiami in casa «{nome}» ({etichetta})?"
    alias_hint: "es. la luce del corridoio. Rispondi «salta» per lasciarlo com'e'."
    alias_lascio: "Va bene, lo lascio com'e'. "
    alias_non_capito: "Non ho capito un nome: lo lascio com'e'. "
    alias_breve: "Un nome e' breve, di poche parole: come lo chiameresti a voce? Oppure rispondi «salta»."
    alias_gia_preso: "«{nome}» e' gia' il nome di {altro}: scegline un altro, oppure rispondi «salta»."
    alias_conferma: "Lo chiamerai «{nome}». E' giusto?"
    alias_suggerimento: "Rispondi «sì» per salvare, «no» per lasciarlo com'e', oppure scrivi un altro nome."
    alias_fatto: "Fatto: da ora «{nome}» e' questo dispositivo. "
    alias_rinuncia: "Lo lascio com'e', per non farti riscrivere all'infinito. "
    noto_profili: "In casa ci sono gia' {nomi}"
    noto_stanze: "Conosco gia' queste stanze: {nomi}"
    noto_fatto: "Ho gia' annotato: «{fatto}»"
    elenco_e: " e "
    r_ignoto: "«{rif}»: non e' un dispositivo che conosco"
    r_comando: "«{nome}»: non so fare «{comando}»"
    r_delicato: "«{nome}»: una routine non lo comanda (e' una cosa delicata)"
    r_pausa: "una pausa con un tempo che non ha senso"
    r_annuncio: "un annuncio vuoto o troppo lungo"
    r_tipo: "un'azione di tipo «{tipo}» che non esiste"
    r_prova_ok: "{n} passi, provati senza toccare la casa"
    r_prova_ferma: "nella prova a secco si fermerebbe dopo {fatti} passi su {attesi}"
    r_luminosita: " al {valore}%"
    r_temperatura: " a {valore} gradi"
    r_pausa_voce: "aspetta {secondi} secondi"
    r_dice: "dice: «{messaggio}»"
  comandi:
    turn_on: "accende"
    turn_off: "spegne"
    toggle: "inverte lo stato di"
    open_cover: "apre"
    close_cover: "chiude"
    stop_cover: "ferma"
  etichette:
    light: "luce"
    switch: "presa o interruttore"
    cover: "tapparella o tenda"
    climate: "clima"
    fan: "ventilatore"
    media_player: "lettore multimediale"
  passi:
    casa_citta:
      title: "Dove si trova la casa"
      question: "In quale città o zona si trova la tua casa?"
      hint: "es. Vivo ad Arezzo."
      parole: ["vivo a", "abito a", "città", "citta", "zona", "si trova a", "si trova ad"]
    casa_piano:
      title: "Il piano"
      question: "A che piano abiti?"
      hint: "es. Al secondo piano di un condominio."
      parole: ["piano"]
    casa_stanze:
      title: "Le stanze"
      question: "Quali sono le stanze principali della casa?"
      hint: "es. Salotto, cucina, due camere e studio."
    famiglia_chi:
      title: "Chi vive in casa"
      question: "Chi vive con te in casa?"
      hint: "es. Mia moglie Sonia e i miei figli Thomas e Christian."
    famiglia_stanze:
      title: "Dove sta ciascuno"
      question: "In quale stanza passa più tempo ciascuno di loro?"
      hint: "es. Thomas sta spesso nella cameretta."
      parole: ["passa più tempo", "sta spesso", "passa piu tempo"]
    mattina_ora:
      title: "L'ora del risveglio"
      question: "A che ora ti svegli di solito?"
      hint: "es. Mi sveglio alle 7:00."
      parole: ["sveglia", "si sveglia", "mi sveglio", "risveglio"]
    mattina_cosa:
      title: "Cosa succede al risveglio"
      question: "Che cosa vorresti che succedesse in casa quando ti svegli?"
      hint: "es. Accendere la luce in cucina e la macchina del caffè."
    notte_ora:
      title: "L'ora di andare a dormire"
      question: "A che ora vai a dormire di solito?"
      hint: "es. Verso le 23:30."
      parole: ["va a letto", "vado a letto", "va a dormire", "vado a dormire"]
    notte_cosa:
      title: "Cosa succede la sera"
      question: "Che cosa deve succedere in casa quando vai a dormire?"
      hint: "es. Spegnere tutte le luci e abbassare il termostato a 18 gradi."
    relax:
      title: "Relax e svago"
      question: "Quando guardi un film, come ti piace impostare le luci del salotto?"
      hint: "es. Le abbasso al 15% e accendo la presa della TV."
    tecnico_wifi:
      title: "La rete per gli ospiti"
      question: "Qual è il nome della rete Wi-Fi per gli ospiti?"
      hint: "es. CasaMia_Guest."
      parole: ["wi-fi", "wifi", "rete ospiti"]
    tecnico_contatore:
      title: "Il contatore"
      question: "Dove si trova il contatore elettrico?"
      hint: "es. Nel sottoscala all'ingresso."
      parole: ["contatore"]
    tecnico_contatto:
      title: "Un contatto importante"
      question: "C'è un contatto importante da ricordare, come l'idraulico o il medico?"
      hint: "es. L'idraulico è Rossi, 333 1234567."
      parole: ["idraulico", "elettricista", "medico", "numero di emergenza"]
  prompt_estrazione: |
    Sei l'assistente IA Shinra. Analizza la risposta dell'utente durante un'intervista ed estrai le informazioni da memorizzare.

    Argomento: {titolo} (Categoria: {categoria})
    Domanda: "{domanda}"
    Risposta: "{risposta}"

    Estrai:
    1. Una lista di 'facts' atomici e chiari in forma di frasi descrittive in terza persona (es. "La sveglia nei feriali è alle ore 7:00").
    2. Se l'utente ha descritto una sequenza di azioni o abitudini, crea un oggetto 'proposed_routine' con 'name', 'description', 'trigger_phrases' e una lista 'actions' (con type 'ha_device', 'tts' o 'delay'). Altrimenti metti null.

    Rispondi ESCLUSIVAMENTE con un JSON:
    {{
      "facts": [
        {{"text": "Frase descrittiva 1", "category": "{categoria}"}}
      ],
      "proposed_routine": null
    }}
  sistema_estrazione: "Rispondi solo con JSON valido. Non aggiungere markdown o spiegazioni."

messaggi:
  serratura_stato: "{nome} e' {stato}."
  serratura_stato_locked: "chiusa"
  serratura_stato_unlocked: "aperta"
  serratura_stato_jammed: "bloccata"
  serratura_chiusa: "{nome} chiusa."
  serratura_aperta: "{nome} aperta."
