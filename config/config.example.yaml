# ---------------------------------------------------------------------------
# Shinra — configurazione
#
# Copiare in config/config.yaml e adattare:
#     cp config/config.example.yaml config/config.yaml
#
# config/config.yaml NON e' versionato: appartiene a questa installazione.
#
# I SEGRETI NON STANNO QUI. Token di Home Assistant, PIN amministratore e
# segreto di sessione si leggono dall'ambiente o da .env — vedi .env.example.
# Se un segreto e' rimasto in questo file da una versione precedente, viene
# spostato in .env al primo avvio e cancellato da qui.
# ---------------------------------------------------------------------------

server:
  host: "0.0.0.0"
  port: 8000
  # Il ricaricamento automatico e le tracce di errore non vanno esposti in
  # rete: in produzione questo valore resta false.
  debug: false

llm:
  # Sovrascrivibile con SHINRA_OLLAMA_URL
  ollama_url: "http://localhost:11434"
  # es. qwen2.5:3b (veloce, supporta i tool), gemma2:9b, llama3.2:3b
  model: "gemma2:9b"
  temperature: 0.4
  timeout_seconds: 60
  max_tokens: 150

home_assistant:
  enabled: true
  # Sovrascrivibile con SHINRA_HA_URL
  url: "http://homeassistant.local:8123"
  # Il token si imposta in .env come SHINRA_HA_TOKEN
  # Entita' media player per gli annunci vocali (es. media_player.echo_cucina)
  alexa_media_player_entity: ""

alexa:
  enabled: true
  # L'App ID si imposta in .env come SHINRA_ALEXA_SKILL_ID.
  # Senza, l'endpoint /api/alexa non puo' verificare da quale skill
  # arrivano i comandi.
  invocation_name: "kyra"
  # Con quali permessi agisce chi parla senza essere riconosciuto (issue #48).
  # E' un nome di ruolo di casa: se ne hai creato uno piu' stretto — un
  # «Ospite fine settimana» che non puo' nemmeno accendere le luci — mettilo
  # qui. Un ruolo che non esiste non da' nessun permesso.
  #
  # Una voce e' riconosciuta solo se in casa sono configurati i profili
  # vocali di Alexa (app Alexa → Impostazioni → Il tuo profilo → Voce) e la
  # voce e' stata associata a un profilo da Impostazioni → Voci Riconosciute.
  ruolo_voce_sconosciuta: "guest"

assistant:
  name: "Kyra"
  default_city: "Roma"

security:
  # Ogni familiare ha il proprio PIN, impostato dal suo profilo.
  # Al primo avvio, se nessuno ne ha uno, viene generato un PIN per
  # l'amministratore e scritto nel log una volta sola.
  # Metterlo a false apre la casa a chiunque sia sulla rete.
  auth_enabled: true
  # Passkey (issue #48). Vuoti significa: ricavali dalla richiesta, che e'
  # cio' che serve in una casa dove nessuno configurera' mai niente.
  #
  # Vale la pena fissare `passkey_rp_id` se la dashboard si raggiunge a piu'
  # nomi (da fuori e da dentro): una passkey registrata su un nome non
  # funziona sull'altro, e l'errore si presenta come «passkey non
  # riconosciuta». `passkey_origine` serve dietro a un reverse proxy che
  # cambia lo schema, dove il server vede http e il browser https.
  #
  # Le passkey non funzionano affatto su un indirizzo numerico o senza
  # HTTPS: in quel caso la dashboard lo dice e si continua con il PIN.
  passkey_rp_id: ""
  passkey_origine: ""
  # Indirizzi dei reverse proxy di cui fidarsi per leggere X-Forwarded-For.
  # Da compilare SOLO se Shinra sta dietro nginx o simili, con l'indirizzo da
  # cui il proxy si presenta — di solito 127.0.0.1. Vuoto significa: non
  # fidarsi di nessuno. Fidarsi di tutti permetterebbe di aggirare la
  # limitazione dei tentativi cambiando un'intestazione.
  trusted_proxies: []
