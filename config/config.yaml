# Shinra Configuration File

server:
  host: "0.0.0.0"
  port: 8000
  debug: true

llm:
  # URL dell'istanza Ollama locale
  ollama_url: "http://localhost:11434"
  # Nome del modello (es. gemma2:9b, gemma2:2b, gemma2, gemma:latest)
  model: "gemma2:9b"
  # Temperatura per le risposte (0.3 - 0.7 consigliato per assistenti)
  temperature: 0.4
  # Timeout per la risposta in secondi
  timeout_seconds: 60

home_assistant:
  enabled: true
  # URL di Home Assistant (es. http://homeassistant.local:8123 o http://192.168.1.xxx:8123)
  url: "http://homeassistant.local:8123"
  # Token di accesso a lungo termine (generabile dal profilo utente in Home Assistant)
  token: "INSERISCI_QUI_IL_TUO_LONG_LIVED_ACCESS_TOKEN"
  # Entità alexa media player per annunci (es. media_player.echo_dot_salotto)
  alexa_media_player_entity: ""

alexa:
  enabled: true
  # Se impostato, verifica che l'App ID corrisponda alla tua skill
  skill_id: ""
  # Nome invocazione skill — dì "Alexa, apri Shinra" o "Alexa, chiedi a Shinra..."
  invocation_name: "shinra"

assistant:
  name: "Shinra"
  language: "it"
  default_city: "Roma" # Città predefinita per meteo locale se non specificata
