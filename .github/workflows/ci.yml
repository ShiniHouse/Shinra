name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  qualita:
    name: Lint e formattazione
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check --output-format=github .

      - name: Black
        run: black --check --diff .

      # Su config/ e core/ la tipizzazione e' pulita e il controllo e'
      # obbligatorio: sono i moduli dove passano configurazione, permessi e
      # dati di casa. Su server/ e integrations/ resta informativo finche'
      # non tocca anche a loro — dichiararlo obbligatorio senza esserlo
      # sarebbe peggio che dirlo.
      - name: Mypy — obbligatorio su config, domain, infra, services e skills
        run: mypy src/shinra/config src/shinra/domain src/shinra/infra src/shinra/services src/shinra/skills

      - name: Mypy — informativo su api e channels
        run: mypy src/shinra/api src/shinra/channels
        continue-on-error: true

  frontend:
    name: Frontend — ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # I copioni della dashboard non passavano da nessun controllo: un nome
      # sbagliato non e' un errore di sintassi, e' un ReferenceError che
      # scatta al clic. Il primo giro di ESLint ne ha trovato uno che era in
      # produzione — il pulsante «+ Timer» non creava niente.
      - name: ESLint
        run: npx eslint --max-warnings 0 --format stylish web/static/js/

      # Prettier non trova guasti: toglie di mezzo la discussione su dove va
      # una parentesi, che su un file da cinquemila righe scritto a mano era
      # diventata un costo vero a ogni modifica.
      - name: Prettier
        run: npx prettier --check web/static/ tests/gesti/ playwright.config.mjs eslint.config.js

  gesti:
    name: Frontend — gesti
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: pip install -e .

      - name: Scarica il browser
        run: npx playwright install chromium --with-deps

      # Due difetti sono arrivati fino in casa passando davanti a tutte
      # le guardie che leggono il sorgente: la crocetta di un nodo che
      # faceva partire il trascinamento, e quella che stacca un cavo che
      # non si poteva premere perche' un altro piano se la prendeva.
      # Nessuna delle due si vede in un file. Qui si preme davvero.
      - name: Gesti dell'interfaccia
        run: npx playwright test

      - name: Cosa e' successo, quando va male
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tracce-dei-gesti
          path: test-results/
          retention-days: 7

  ganci:
    name: Ganci pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pre-commit
      # Gli stessi controlli che girano prima di ogni commit su una macchina
      # di sviluppo. Averli anche qui evita che restino disallineati: un
      # gancio che nessuno esegue in CI smette di funzionare senza che
      # nessuno se ne accorga.
      # `no-commit-to-branch` protegge chi sviluppa dal committare su main
      # per distrazione; in CI si lavora proprio su quel ramo, quindi qui
      # farebbe fallire tutto senza dire niente di utile.
      - run: SKIP=no-commit-to-branch pre-commit run --all-files --show-diff-on-failure

      # I ganci che correggono da soli (spazi in coda, a capo finale) falliscono
      # dicendo «files were modified by this hook» senza dire quali. Questo
      # passo lo dice, e fa risparmiare mezz'ora a chi legge il log.
      - name: Cosa hanno cambiato i ganci
        if: failure()
        run: |
          echo "== file modificati =="
          git status --porcelain
          echo "== differenze =="
          git --no-pager diff

  test:
    name: Test — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # La suite gira in una decina di secondi. Un tetto esplicito serve
    # perche' un test sul WebSocket che non riceve mai resterebbe in attesa
    # per ore invece di fallire.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest
        # I test marcati network o integration richiedono Internet, Ollama o
        # Home Assistant: non hanno posto in CI.
        # La soglia e' al 70% mentre la copertura reale e' all'80%: sotto il
        # valore attuale perche' non fallisca per un test spostato, sopra il
        # 60% chiesto dalla issue #18 perche' significhi qualcosa. Si alza
        # quando sale la copertura, non prima.
        run: pytest -m "not network and not integration" --cov --cov-report=term-missing --cov-fail-under=70

  segreti:
    name: Controllo segreti
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Nessun file sensibile tracciato
        run: |
          set -e
          vietati="config/config.yaml .env data/users.json data/knowledge.json
                   data/device_aliases.json data/modes.json data/sources.json
                   data/timers.json data/reminders.json"
          errori=0
          for f in $vietati; do
            if git ls-files --error-unmatch "$f" > /dev/null 2>&1; then
              echo "::error file=$f::$f e' tracciato da git ma contiene o ricevera' dati personali o segreti. I valori iniziali vanno in data/examples/."
              errori=1
            fi
          done
          exit $errori

      - name: Nessun token in chiaro nel codice
        run: |
          set -e
          # Token a lungo termine di Home Assistant: JWT che inizia per eyJ.
          #
          # Un valore deliberatamente finto — in un test, in un esempio — si
          # dichiara aggiungendo sulla stessa riga:
          #     # pragma: allowlist secret
          # Serve una dichiarazione esplicita e leggibile in revisione, non
          # un'esclusione di intere cartelle: un segreto vero puo' finire in
          # un test tanto quanto altrove.
          trovati="$(grep -rInE "eyJ[A-Za-z0-9_-]{30,}" \
                       --exclude-dir=.git --exclude-dir=.venv \
                       --exclude-dir=node_modules . \
                     | grep -v "pragma: allowlist secret" || true)"
          if [ -n "$trovati" ]; then
            echo "$trovati"
            echo "::error::Possibile token nel repository. Se e' un valore finto, dichiaralo con  # pragma: allowlist secret  sulla stessa riga."
            exit 1
          fi
          echo "Nessun token trovato."

  immagine:
    name: Immagine Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Si costruisce e si tiene qui: la pubblicazione e' un altro lavoro, e
      # succede al tag. Questo serve a sapere che il Dockerfile costruisce
      # **prima** di unire, non dopo.
      - name: Costruisci
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: shinra:prova
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Costruire non basta: un'immagine che si costruisce e non parte e'
      # esattamente il tipo di difetto che si scopre in casa di qualcun altro.
      - name: Parte, e risponde
        run: |
          set -e
          docker run -d --name prova -p 8000:8000 shinra:prova
          for tentativo in $(seq 1 30); do
            stato="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/auth/status || true)"
            if [ "$stato" = "200" ]; then
              echo "Risponde dopo $tentativo tentativi."
              break
            fi
            sleep 2
          done
          if [ "$stato" != "200" ]; then
            echo "::error::L'immagine parte ma /api/auth/status risponde $stato"
            docker logs prova
            exit 1
          fi

      - name: Il primo accesso e' possibile
        run: |
          set -e
          # Senza questo, un'immagine che parte ma non crea il profilo
          # amministratore passerebbe: la dashboard sarebbe raggiungibile e
          # nessuno potrebbe entrarci.
          if ! docker logs prova 2>&1 | grep -q "PRIMO ACCESSO"; then
            echo "::error::Il PIN del primo accesso non compare nel log: nessuno puo' entrare."
            docker logs prova
            exit 1
          fi
          echo "Il PIN del primo accesso c'e'."

      - name: Non gira da root
        run: |
          set -e
          utente="$(docker exec prova id -un)"
          if [ "$utente" = "root" ]; then
            echo "::error::L'immagine gira da root."
            exit 1
          fi
          echo "Gira da «$utente»."

      - name: I dati stanno dove il compose li cerca
        run: |
          set -e
          # `docker-compose.yml` monta i volumi su /app/data e /app/config.
          # Se l'applicazione scrivesse altrove, il compose girerebbe e i dati
          # sparirebbero al primo aggiornamento — senza che niente lo dica.
          docker exec prova test -f /app/data/shinra.db \
            || { echo "::error::Il database non e' in /app/data: i volumi del compose non lo conserverebbero."; docker exec prova ls -la /app; exit 1; }
          docker exec prova test -f /app/config/config.example.yaml \
            || { echo "::error::L'esempio di configurazione non e' stato messo nel volume."; exit 1; }
          echo "Database e configurazione sono dove devono."

      - name: Il compose e' valido e punta all'immagine giusta
        run: docker compose config >/dev/null && echo "docker-compose.yml valido."

      - name: Spegni
        if: always()
        run: docker rm -f prova || true
