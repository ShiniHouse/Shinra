name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  qualita:
    name: Lint e formattazione
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check --output-format=github .

      - name: Black
        run: black --check --diff .

      # Su config/ e core/ la tipizzazione e' pulita e il controllo e'
      # obbligatorio: sono i moduli dove passano configurazione, permessi e
      # dati di casa. Su server/ e integrations/ resta informativo finche'
      # non tocca anche a loro — dichiararlo obbligatorio senza esserlo
      # sarebbe peggio che dirlo.
      - name: Mypy — obbligatorio su config e core
        run: mypy --explicit-package-bases config core

      - name: Mypy — informativo su server e integrations
        run: mypy --explicit-package-bases server integrations
        continue-on-error: true

  ganci:
    name: Ganci pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pre-commit
      # Gli stessi controlli che girano prima di ogni commit su una macchina
      # di sviluppo. Averli anche qui evita che restino disallineati: un
      # gancio che nessuno esegue in CI smette di funzionare senza che
      # nessuno se ne accorga.
      # `no-commit-to-branch` protegge chi sviluppa dal committare su main
      # per distrazione; in CI si lavora proprio su quel ramo, quindi qui
      # farebbe fallire tutto senza dire niente di utile.
      - run: SKIP=no-commit-to-branch pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # La suite gira in una decina di secondi. Un tetto esplicito serve
    # perche' un test sul WebSocket che non riceve mai resterebbe in attesa
    # per ore invece di fallire.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest
        # I test marcati network o integration richiedono Internet, Ollama o
        # Home Assistant: non hanno posto in CI.
        # La soglia e' al 70% mentre la copertura reale e' all'80%: sotto il
        # valore attuale perche' non fallisca per un test spostato, sopra il
        # 60% chiesto dalla issue #18 perche' significhi qualcosa. Si alza
        # quando sale la copertura, non prima.
        run: pytest -m "not network and not integration" --cov --cov-report=term-missing --cov-fail-under=70

  segreti:
    name: Controllo segreti
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Nessun file sensibile tracciato
        run: |
          set -e
          vietati="config/config.yaml .env data/users.json data/knowledge.json
                   data/device_aliases.json data/modes.json data/sources.json
                   data/timers.json data/reminders.json"
          errori=0
          for f in $vietati; do
            if git ls-files --error-unmatch "$f" > /dev/null 2>&1; then
              echo "::error file=$f::$f e' tracciato da git ma contiene o ricevera' dati personali o segreti. I valori iniziali vanno in data/examples/."
              errori=1
            fi
          done
          exit $errori

      - name: Nessun token in chiaro nel codice
        run: |
          set -e
          # Token a lungo termine di Home Assistant: JWT che inizia per eyJ.
          #
          # Un valore deliberatamente finto — in un test, in un esempio — si
          # dichiara aggiungendo sulla stessa riga:
          #     # pragma: allowlist secret
          # Serve una dichiarazione esplicita e leggibile in revisione, non
          # un'esclusione di intere cartelle: un segreto vero puo' finire in
          # un test tanto quanto altrove.
          trovati="$(grep -rInE "eyJ[A-Za-z0-9_-]{30,}" \
                       --exclude-dir=.git --exclude-dir=.venv \
                       --exclude-dir=node_modules . \
                     | grep -v "pragma: allowlist secret" || true)"
          if [ -n "$trovati" ]; then
            echo "$trovati"
            echo "::error::Possibile token nel repository. Se e' un valore finto, dichiaralo con  # pragma: allowlist secret  sulla stessa riga."
            exit 1
          fi
          echo "Nessun token trovato."
