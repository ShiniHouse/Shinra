# Installazione:  pre-commit install
# Esecuzione manuale su tutto:  pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black

  - repo: local
    hooks:
      - id: nessun-file-sensibile
        name: nessun file sensibile nel commit
        entry: >-
          bash -c 'for f in "$@"; do case "$f" in
          config/config.yaml|.env|data/users.json|data/knowledge.json)
          echo "BLOCCATO: $f contiene dati sensibili e non va committato"; exit 1;;
          esac; done' --
        language: system
        pass_filenames: true
