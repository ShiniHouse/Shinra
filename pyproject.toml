[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shinra"
# In sviluppo verso la 0.3.0. Il numero torna `.dev` subito dopo il tag: da
# quel momento `main` non e' piu' la release, e il badge nella dashboard deve
# dirlo. Un `0.2.0` su codice che la 0.2.0 non contiene e' precisamente la
# bugia che quel badge esiste per impedire.
version = "0.4.0.dev0"
description = "Hub domotico con IA locale, controllo Home Assistant e interfaccia vocale"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alessio Guidelli" }]
keywords = ["home-assistant", "domotica", "ollama", "assistente-vocale", "alexa"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Italian",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Home Automation",
]

dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.28.0",
  # Il client WebSocket verso Home Assistant (issue #19). Arriva gia' con
  # uvicorn[standard], ma una dipendenza che si usa si dichiara: altrimenti
  # basta che uvicorn cambi i suoi extra e la casa smette di sapere cosa
  # succede, senza che nessuno abbia toccato niente.
  "websockets>=12.0",
  "httpx>=0.27.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "pyyaml>=6.0.1",
  "jinja2>=3.1.3",
  "beautifulsoup4>=4.12.3",
  # Verifica della firma Amazon su /api/alexa: senza X.509 non e' possibile.
  "cryptography>=42.0",
  # Scheduler persistente per timer, promemoria e automazioni (ADR 0003).
  "apscheduler>=3.10",
  "sqlalchemy>=2.0",
  # Migrazioni di schema: scripts/deploy.sh esegue `alembic upgrade head`
  # a ogni aggiornamento, quindi e' una dipendenza del servizio, non di sviluppo.
  "alembic>=1.13",
  "feedparser>=6.0.11",
  "edge-tts>=6.1.12",
  # Notifiche push verso i browser (issue #29). Implementa l'RFC 8291: la
  # cifratura della busta push e' esattamente il genere di codice in cui un
  # errore sottile non si vede — la notifica non arriva, oppure arriva
  # leggibile a chi non deve — e riscriverla per non aggiungere una
  # dipendenza sarebbe un pessimo scambio.
  "pywebpush>=2.0",
  # Passkey (issue #48). WebAuthn e' verifica di firme, parsing CBOR e
  # attestazioni: e' il genere di codice dove un errore non si vede — la
  # firma viene accettata comunque — e riscriverlo per non aggiungere una
  # dipendenza sarebbe un pessimo scambio. Il codice che la usa la tratta
  # comunque come facoltativa: se manca, si entra con il PIN.
  "webauthn>=3.0",
  # `python-multipart` serve a FastAPI per leggere un caricamento di file:
  # senza, la rotta che riceve l'audio del microfono non si registra nemmeno
  # (issue #31).
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Riconoscimento vocale in casa (issue #31). Non e' fra le dipendenze
# obbligatorie per il peso: `faster-whisper` porta con se' CTranslate2 e PyAV,
# e il modello si scarica al primo uso. Senza, il microfono della dashboard
# non funziona e lo dice — di proposito: l'alternativa sarebbe ripiegare in
# silenzio sulla Web Speech API, cioe' mandare la voce di casa a Google senza
# dirlo, che e' esattamente cio' che questa versione smette di fare.
voce = [
  "faster-whisper>=1.0",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  # Versioni esatte, e non un minimo: devono coincidere con quelle fissate
  # in .pre-commit-config.yaml, altrimenti la CI e i ganci danno due
  # risposte diverse sullo stesso file. Si aggiornano insieme.
  "ruff==0.16.5",
  "black==26.5.1",
  "mypy>=1.9",
  "types-PyYAML",
  "pre-commit>=3.7",
]

[project.urls]
Repository = "https://github.com/ShiniHouse/Shinra"
Changelog = "https://github.com/ShiniHouse/Shinra/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/ShiniHouse/Shinra/blob/main/docs/ROADMAP.md"

# Il codice vive sotto src/. Non e' una convenzione estetica: con le cartelle
# in cima al repository, un `import config` puo' risolvere sulla directory di
# lavoro invece che sul progetto — e `config` e' un nome che hanno in molti.
# Sotto src/ il pacchetto e' raggiungibile solo se installato, quindi i test
# provano cio' che si installa davvero. Riferimento: issue #16.
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# `shinra` da riga di comando. `run.py` resta come alias: il servizio in
# produzione parte da li' (deploy/shinra.service).
[project.scripts]
shinra = "shinra.avvio:principale"

# --------------------------------- Ruff -----------------------------------
[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [".venv", "web", "data"]

[tool.ruff.lint]
# Insieme di partenza: correttezza, sicurezza e igiene, senza le regole di
# modernizzazione (UP) che imporrebbero 186 riscritture sul codice esistente.
# Vengono attivate una alla volta durante il riordino della v0.2.0 (issue #18):
# una regola che nessuno riesce a soddisfare viene solo disattivata.
select = ["E", "F", "W", "I", "B", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = [
  "E501",    # lunghezza riga gestita da black
  "B008",    # Depends() nei default e' idiomatico in FastAPI
  "S101",    # assert consentiti nei test
  "S104",    # 0.0.0.0 e' il valore atteso per un servizio di rete domestico
  "SIM105",  # contextlib.suppress non e' piu' chiaro di try/except/pass
]

# Da attivare progressivamente (issue v0.2.0 #18):
#   UP    modernizzazione delle annotazioni di tipo   (186 rilievi)
#   ANN   annotazioni obbligatorie                    (dopo UP)
#   D     docstring                                   (dopo ANN)

[tool.ruff.lint.per-file-ignores]
# Nei test i valori fissi sono finti per definizione, e invocare git fa
# parte di cio' che verificano.
# S303: i test della firma Alexa devono usare SHA-1 perche' e' quello che
# usa Amazon. Firmare con altro non proverebbe nulla.
"tests/*" = ["S101", "S105", "S106", "S303", "S603", "S607"]
# Lo script di importazione invoca gh: e' il suo scopo.
"scripts/import_backlog.py" = ["S603", "S607"]
# Gli script mettono `src/` in sys.path prima di poter importare il
# pacchetto: gli import devono per forza venire dopo.
"scripts/imposta_pin.py" = ["E402"]
# L'agente importa alcuni moduli dentro le funzioni per evitare import
# circolari. Sara' risolto dall'intent router (issue v0.2.0 #17).
"src/shinra/services/agent.py" = ["E402"]
"src/shinra/api/routes_admin.py" = ["E402"]
"src/shinra/api/app.py" = ["E402"]

# --------------------------------- Black ----------------------------------
[tool.black]
line-length = 110
target-version = ["py310"]
extend-exclude = "/(\\.venv|web|data)/"

# --------------------------------- Pytest ---------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
  "network: test che richiede accesso a Internet (escluso in CI con -m 'not network')",
  "integration: test che richiede Ollama o Home Assistant attivi",
]

[tool.coverage.run]
source = ["shinra"]
omit = ["*/tests/*", "*/.venv/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# ---------------------------------- Mypy ----------------------------------
[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
ignore_missing_imports = true
# Progressivo: si parte permissivi e si stringe modulo per modulo (issue v0.2.0)
check_untyped_defs = false
disallow_untyped_defs = false
exclude = "(\\.venv|web|data)/"
