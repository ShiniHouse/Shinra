[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shinra"
version = "0.1.0.dev0"
description = "Hub domotico con IA locale, controllo Home Assistant e interfaccia vocale"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alessio Guidelli" }]
keywords = ["home-assistant", "domotica", "ollama", "assistente-vocale", "alexa"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Italian",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Home Automation",
]

dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.28.0",
  "httpx>=0.27.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "pyyaml>=6.0.1",
  "jinja2>=3.1.3",
  "beautifulsoup4>=4.12.3",
  # Verifica della firma Amazon su /api/alexa: senza X.509 non e' possibile.
  "cryptography>=42.0",
  "feedparser>=6.0.11",
  "edge-tts>=6.1.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.5",
  "black>=24.3",
  "mypy>=1.9",
  "types-PyYAML",
  "pre-commit>=3.7",
]

[project.urls]
Repository = "https://github.com/ShiniHouse/Shinra"
Changelog = "https://github.com/ShiniHouse/Shinra/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/ShiniHouse/Shinra/blob/main/docs/ROADMAP.md"

# ---------------------------------------------------------------------------
# Nota: fino alla v0.2.0 il codice vive nelle cartelle di primo livello
# (core/, server/, config/, integrations/). Lo spostamento sotto src/shinra/
# e' pianificato nella issue "Layout src/ e packaging" della milestone v0.2.0.
# ---------------------------------------------------------------------------
[tool.setuptools]
packages = ["config", "core", "core.tools", "integrations", "integrations.alexa", "server"]

# --------------------------------- Ruff -----------------------------------
[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [".venv", "web", "data"]

[tool.ruff.lint]
# Insieme di partenza: correttezza, sicurezza e igiene, senza le regole di
# modernizzazione (UP) che imporrebbero 186 riscritture sul codice esistente.
# Vengono attivate una alla volta durante il riordino della v0.2.0 (issue #18):
# una regola che nessuno riesce a soddisfare viene solo disattivata.
select = ["E", "F", "W", "I", "B", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = [
  "E501",    # lunghezza riga gestita da black
  "B008",    # Depends() nei default e' idiomatico in FastAPI
  "S101",    # assert consentiti nei test
  "S104",    # 0.0.0.0 e' il valore atteso per un servizio di rete domestico
  "SIM105",  # contextlib.suppress non e' piu' chiaro di try/except/pass
]

# Da attivare progressivamente (issue v0.2.0 #18):
#   UP    modernizzazione delle annotazioni di tipo   (186 rilievi)
#   ANN   annotazioni obbligatorie                    (dopo UP)
#   D     docstring                                   (dopo ANN)

[tool.ruff.lint.per-file-ignores]
# Nei test i valori fissi sono finti per definizione, e invocare git fa
# parte di cio' che verificano.
# S303: i test della firma Alexa devono usare SHA-1 perche' e' quello che
# usa Amazon. Firmare con altro non proverebbe nulla.
"tests/*" = ["S101", "S105", "S106", "S303", "S603", "S607"]
# Lo script di importazione invoca gh: e' il suo scopo.
"scripts/import_backlog.py" = ["S603", "S607"]
# L'agente importa alcuni moduli dentro le funzioni per evitare import
# circolari. Sara' risolto dall'intent router (issue v0.2.0 #17).
"core/agent.py" = ["E402"]
"server/routes_admin.py" = ["E402"]
"server/app.py" = ["E402"]

# --------------------------------- Black ----------------------------------
[tool.black]
line-length = 110
target-version = ["py310"]
extend-exclude = "/(\\.venv|web|data)/"

# --------------------------------- Pytest ---------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
  "network: test che richiede accesso a Internet (escluso in CI con -m 'not network')",
  "integration: test che richiede Ollama o Home Assistant attivi",
]

[tool.coverage.run]
source = ["core", "server", "config", "integrations"]
omit = ["*/tests/*", "*/.venv/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# ---------------------------------- Mypy ----------------------------------
[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
ignore_missing_imports = true
# Progressivo: si parte permissivi e si stringe modulo per modulo (issue v0.2.0)
check_untyped_defs = false
disallow_untyped_defs = false
exclude = "(\\.venv|web|data)/"
