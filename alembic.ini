# Migrazioni dello schema del database.
#
# scripts/deploy.sh esegue `alembic upgrade head` a ogni aggiornamento, prima
# di riavviare il servizio: lo schema si allinea da solo, senza interventi a
# mano sul server.
#
#   alembic revision --autogenerate -m "cosa cambia"   crea una revisione
#   alembic upgrade head                               la applica
#   alembic downgrade -1                               torna indietro di una

[alembic]
script_location = migrazioni
prepend_sys_path = .
path_separator = os
# L'indirizzo del database non e' scritto qui: lo fornisce migrazioni/env.py
# leggendolo da core/archivio/motore.py, cosi' esiste un posto solo che sa
# dove vive l'archivio.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
