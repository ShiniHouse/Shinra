    <!-- Generic Modal Dialog -->
    <div id="modal-backdrop" style="display:none" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 items-center justify-center p-4">
        <div id="modal-container" class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
            <!-- Modal Content Injection -->
        </div>
    </div>

    <!-- Lock Screen Modal -->
    <div id="lock-screen-modal" style="display:none" class="fixed inset-0 bg-slate-950/90 backdrop-blur-xl z-[999] flex items-center justify-center p-4">
        <div class="bg-slate-900/90 border border-slate-800 rounded-3xl max-w-md w-full p-8 shadow-2xl space-y-6 text-center">
            <div class="flex justify-center">
                <div class="living-core !w-16 !h-16 !rounded-2xl">
                    <div class="living-core-halo"></div>
                    <i data-lucide="lock" class="w-8 h-8 text-white"></i>
                </div>
            </div>
            <div>
                <h3 class="text-xl font-extrabold text-slate-100">Chi sei?</h3>
                <p id="unlock-sottotitolo" class="text-xs text-slate-400 mt-1">Scegli il tuo profilo per accedere.</p>
            </div>

            <!-- Scelta del profilo -->
            <div id="unlock-profili" class="grid grid-cols-2 gap-2.5"></div>

            <!-- PIN del profilo scelto -->
            <form id="unlock-form-pin" data-all-invio="handleUnlockSubmit" data-argomento="evento" class="space-y-4 hidden">
                <div class="flex items-center justify-center gap-2 text-sm text-slate-300">
                    <span id="unlock-profilo-scelto" class="font-bold"></span>
                    <button type="button" data-gesto="tornaAllaSceltaProfilo" class="text-[11px] text-indigo-400 hover:text-indigo-300 underline">cambia</button>
                </div>
                <input type="password" inputmode="numeric" id="unlock-pin-input" placeholder="••••" maxlength="12" autocomplete="current-password" class="w-full text-center text-2xl font-mono tracking-widest bg-slate-950 border border-slate-700 rounded-2xl p-3 text-amber-400 focus:outline-none focus:border-amber-500 transition">
                <div id="unlock-error-msg" class="hidden text-xs text-rose-400 font-semibold animate-pulse">PIN non corretto. Riprova.</div>
                <!--
                  «Ricorda questo dispositivo» c'era solo sulla pagina di
                  accesso, non qui (issue #161). Ma qui e' dove si finisce
                  quando il servizio si riavvia con la dashboard aperta: si
                  rimetteva il PIN e si rientrava **senza** dispositivo
                  fidato, quindi al riavvio dopo si ricominciava — canale
                  degli eventi compreso.
                -->
                <label class="flex items-center justify-center gap-2 text-[11px] text-slate-400 cursor-pointer select-none">
                    <input type="checkbox" id="unlock-ricorda" class="w-3.5 h-3.5 rounded border-slate-600 bg-slate-950 text-indigo-500 focus:ring-indigo-500 cursor-pointer">
                    Ricorda questo dispositivo
                </label>
                <button type="submit" class="w-full py-3 bg-gradient-to-r from-amber-500 to-indigo-600 hover:from-amber-400 hover:to-indigo-500 text-white font-bold rounded-2xl transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
                    <i data-lucide="unlock" class="w-4 h-4"></i> Entra
                </button>
            </form>
        </div>
    </div>

    <!-- Learning Interview Modal ("Shinra Istruisci") -->
    <div id="learning-interview-modal" style="display:none" class="fixed inset-0 bg-black/75 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900/95 border border-slate-700/80 rounded-3xl max-w-2xl w-full p-6 shadow-2xl space-y-5 text-slate-100 relative max-h-[90vh] overflow-y-auto">
            <!-- Header -->
            <div class="flex items-center justify-between border-b border-slate-800/80 pb-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-amber-500 to-indigo-600 flex items-center justify-center text-white text-xl shadow-lg">
                        🎓
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-100 flex items-center gap-2">
                            Shinra Istruisci
                            <span id="learning-step-badge" class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">Fase 1 di 6</span>
                        </h3>
                        <p class="text-xs text-slate-400">Intervista guidata per l'apprendimento delle abitudini domestiche</p>
                    </div>
                </div>
                <button data-gesto="closeLearningModal" class="text-slate-400 hover:text-slate-200 p-1.5 rounded-xl hover:bg-slate-800 transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-slate-950 rounded-full h-2 overflow-hidden border border-slate-800">
                <div id="learning-progress-bar" class="bg-gradient-to-r from-amber-500 via-violet-500 to-indigo-500 h-full transition-all duration-500" style="width: 16%"></div>
            </div>

            <!-- Shinra Dialogue Question Box -->
            <div class="p-4 rounded-2xl bg-gradient-to-br from-slate-950/80 to-slate-900/80 border border-indigo-500/30 space-y-2">
                <div class="flex items-center justify-between">
                    <span id="learning-topic-title" class="text-xs font-bold text-amber-400 uppercase tracking-wider flex items-center gap-1.5">
                        <i data-lucide="help-circle" class="w-3.5 h-3.5"></i> Argomento
                    </span>
                    <button data-gesto="replayLearningQuestionAudio" class="text-xs text-indigo-300 hover:text-indigo-200 flex items-center gap-1 font-semibold">
                        <i data-lucide="volume-2" class="w-3.5 h-3.5"></i> Riascolta
                    </button>
                </div>
                <p id="learning-question-text" class="text-base font-semibold text-slate-100 leading-relaxed"></p>
                <p id="learning-hint-text" class="text-xs text-slate-400 italic pt-1"></p>
            </div>

            <!-- Routine Proposal Card (if detected) -->
            <div id="learning-routine-box" class="hidden p-4 rounded-2xl bg-gradient-to-r from-emerald-950/60 to-slate-900 border border-emerald-500/40 space-y-2">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-emerald-300 uppercase tracking-wide flex items-center gap-1.5">
                        <i data-lucide="zap" class="w-4 h-4 text-emerald-400 animate-bounce"></i> Routine Automatica Rilevata!
                    </span>
                </div>
                <p id="learning-routine-desc" class="text-xs text-slate-200"></p>
                <div class="flex gap-2 pt-1">
                    <button id="learning-routine-confirm-btn" data-gesto="acceptProposedRoutine" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-md">
                        <i data-lucide="check" class="w-3.5 h-3.5"></i> Crea Routine con 1 Clic
                    </button>
                </div>
            </div>

            <!-- User Answer Input -->
            <div class="space-y-2">
                <label class="text-xs text-slate-400 font-semibold flex items-center justify-between">
                    <span>La tua risposta (a voce o digitata):</span>
                    <span id="learning-mic-status" class="text-[11px] text-amber-400 hidden animate-pulse">🎙️ In ascolto... parla pure</span>
                </label>
                <div class="relative">
                    <textarea id="learning-answer-input" rows="3" placeholder="Parla al microfono o scrivi qui la tua risposta..." class="w-full bg-slate-950 border border-slate-700/80 rounded-2xl p-3.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition resize-none"></textarea>
                    <button type="button" id="learning-mic-btn" data-gesto="toggleLearningMic" class="absolute right-3 bottom-3 p-2.5 rounded-xl bg-slate-800 hover:bg-indigo-600 text-slate-300 hover:text-white transition shadow" title="Attiva/Disattiva Microfono">
                        <i data-lucide="mic" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Learned Facts for this session -->
            <div id="learning-facts-container" class="hidden space-y-1.5">
                <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wide">Fatti appena appresi da Shinra:</span>
                <div id="learning-facts-list" class="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto"></div>
            </div>

            <!-- Footer Buttons -->
            <div class="flex items-center justify-between pt-2 border-t border-slate-800">
                <button type="button" data-gesto="closeLearningModal" class="px-3.5 py-2 text-xs font-semibold text-slate-400 hover:text-slate-200 transition">
                    Termina Sessione
                </button>
                <div class="flex items-center gap-2">
                    <button type="button" id="learning-submit-btn" data-gesto="submitLearningAnswer" class="px-5 py-2.5 bg-gradient-to-r from-amber-500 to-indigo-600 hover:from-amber-400 hover:to-indigo-500 text-white rounded-xl text-xs font-bold transition shadow-lg shadow-indigo-600/30 flex items-center gap-2">
                        <span>Invia Risposta</span>
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
